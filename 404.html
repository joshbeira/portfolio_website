<!DOCTYPE html>

<head>

<style>
  .nf { min-height: 100svh; display: flex; flex-direction: column; justify-content: center;
        align-items: center; text-align: center; padding: 0 var(--gutter); }
  .nf__code { font-family: var(--mono); font-size: 11px; letter-spacing: 0.09em;
              color: var(--accent); margin-bottom: 22px; }
  .nf__title { font-size: clamp(34px, 9vw, 62px); line-height: 1; letter-spacing: -0.04em;
               font-weight: 500; color: var(--ink-bright); margin: 0; }
  .nf__body { margin: 20px auto 0; max-width: 44ch; font-size: 15px; line-height: 1.65;
              color: var(--muted); text-wrap: pretty; }
  .nf__home { display: inline-block; margin-top: 32px; font-family: var(--mono); font-size: 12px;
              color: var(--ink-bright); border-bottom: 1px solid var(--accent); padding-bottom: 4px; }
  .nf__home:hover { color: var(--accent); }
</style>
</head>
<body>

  <p class="nf__code">error 404</p>
  <h1 class="nf__title">No page here</h1>
